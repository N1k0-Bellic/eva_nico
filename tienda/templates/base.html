
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Tienda de juegos de mesa{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f5f7;
            color: #263238;
        }
        header {
            background: #263238;
            color: white;
            padding: 18px 24px;
        }
        nav a {
            color: white;
            margin-right: 20px;
            text-decoration: none;
        }
        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }
        form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        input, select, button {
            padding: 10px;
        }
        .juegos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
        }
        .juego {
            background: white;
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 2px 6px #ddd;
        }
        .juego img {
            width: 100%;
            height: 200px;
            object-fit: contain;
        }
        .precio {
            font-weight: bold;
            color: #087f5b;
        }
        .agotado {
            color: #b71c1c;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <h1>Tienda de juegos de mesa</h1>
        <nav>
            <a href="{% url 'tienda:inicio' %}">Inicio</a>
        </nav>
    </header>

    <main>
        {% block contenido %}
        {% endblock %}
    </main>
</body>
</html>
